name: Indexing notify

# 글을 올리거나 페이지를 바꿔 main 에 push 하면, 배포 후 검색엔진에 즉시 색인 통보한다.
# - IndexNow: 빙·네이버 등(키 불필요, 사이트 루트의 키 파일로 자동 검증)
# - Google Indexing API: 선택. 리포지토리 Secret 에 GCP_SA_KEY 가 있으면 함께 실행.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (sitemap·feed·urls.txt 생성)
        run: python3 build.py

      - name: Netlify 배포 대기
        run: sleep 90   # Netlify 배포가 끝나야 IndexNow 키 검증이 통과합니다.

      - name: IndexNow 통보 (Bing·Naver)
        run: python3 tools/indexnow_submit.py

      - name: Google Indexing API 통보 (선택)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install --quiet google-auth
          printf '%s' "$GCP_SA_KEY" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          python3 tools/google_indexing.py
